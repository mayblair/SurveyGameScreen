<!DOCTYPE html>
<html>
<head>
    <title>Controller</title>
    <link rel="stylesheet" href="style.css">
    <script src="/socket.io/socket.io.js"></script>
</head>

<body class="orange-bg">

<h1>Controller</h1>

<!-- QUESTION DISPLAY -->
<div id="questionScreen">

    <h2 id="timer"></h2>
    <h1 id="question"></h1>

    <div id="answers" class="button-grid"></div>

    <div id="supplementaryText" class="supplementary-box"></div>

</div>

<!-- RESULTS DISPLAY -->
<div id="resultsScreen" class="screen blue-bg" style="display:none;">
    <h1>Results</h1>

    <table class="results-table">
        <thead>
        <tr>
            <th>Class</th>
            <th>Response Rate</th>
            <th>Score</th>
        </tr>
        </thead>
        <tbody id="totalResults"></tbody>
    </table>

</div>

<!-- CONTROL BUTTONS -->
<div class="controller-buttons">
    <button onclick="startQuestion()">Next Question</button>
    <button onclick="showAnswer()">Show Answer</button>
    <button onclick="showResults()">Show Results</button>
</div>

<script>

    const socket = io();

    const timerEl = document.getElementById("timer");
    const questionEl = document.getElementById("question");
    const answersEl = document.getElementById("answers");
    const supplementaryEl = document.getElementById("supplementaryText");
    const resultsScreen = document.getElementById("resultsScreen");
    const questionScreen = document.getElementById("questionScreen");

    const totalStudents = {
        "Class 1": 187,
        "Class 2": 189,
        "Class 3": 173,
        "Class 4": 162
    };

    let currentQuestionId = null;

    socket.on("updateState", (state) => {

        // QUESTION SCREEN
        if (state.currentScreen === "question" && state.currentQuestion) {

            document.body.classList.remove("blue-bg");
            document.body.classList.add("orange-bg");

            questionScreen.style.display = "block";
            resultsScreen.style.display = "none";

            timerEl.innerText = state.timer;
            questionEl.innerText = state.currentQuestion.question;

            if (state.currentQuestion.id !== currentQuestionId) {

                currentQuestionId = state.currentQuestion.id;
                answersEl.innerHTML = "";
                supplementaryEl.innerText = "";

                state.currentQuestion.answers.forEach(ans => {

                    const btn = document.createElement("button");
                    btn.innerText = ans;
                    btn.className = "answer-btn";
                    btn.disabled = true;

                    answersEl.appendChild(btn);
                });
            }
        }

        // ANSWER SCREEN
        if (state.currentScreen === "answer" && state.currentQuestion) {

            document.querySelectorAll(".answer-btn").forEach(btn => {
                if (btn.innerText === state.currentQuestion.correct) {
                    btn.style.backgroundColor = "#2ecc71";
                    btn.style.color = "white";
                }
            });

            supplementaryEl.innerText = state.currentQuestion.explanation || "";
        }

        // RESULTS SCREEN
        if (state.currentScreen === "results") {

            document.body.classList.remove("orange-bg");
            document.body.classList.add("blue-bg");

            questionScreen.style.display = "none";
            resultsScreen.style.display = "block";

            renderResults(state);
        }
    });

    function startQuestion() {
        socket.emit("startQuestion");
    }

    function showAnswer() {
        socket.emit("showAnswer");
    }

    function showResults() {
        socket.emit("showResults");
    }

    function renderResults(state) {

        const totalBody = document.getElementById("totalResults");
        totalBody.innerHTML = "";

        for (let group in state.totalScores) {

            const classSize = totalStudents[group] || 1;

            const totalResponseRate = state.questionsPlayed > 0
                ? Math.round(
                    (state.totalResponses[group] / (classSize * state.questionsPlayed)) * 100
                  )
                : 0;

            const totalAverageScore = state.questionsPlayed > 0
                ? Math.round(state.totalScores[group] / state.questionsPlayed)
                : 0;

            totalBody.innerHTML += `
                <tr>
                    <td>${group}</td>
                    <td>${totalResponseRate}%</td>
                    <td>${totalAverageScore}</td>
                </tr>
            `;
        }
    }

</script>

</body>
</html>
